<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Student Management System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="corner-tri tl"></div>
  <div class="corner-tri br"></div>
  <div class="auth-card">
    <h1><span class="dot" style="width:10px;height:10px;background:var(--red);border-radius:50%;display:inline-block;"></span> Student Management System</h1>
    <p class="subtitle">Log in to your dashboard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn full">Log In</button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a>
    </div>
  </div>
</div>
</body>
</html>
